name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    name: Check if version published
    runs-on: ubuntu-latest
    outputs:
      core-npm-changed: ${{ steps.check.outputs.core-npm-changed }}
      connect-npm-changed: ${{ steps.check.outputs.connect-npm-changed }}
      contfu-npm-changed: ${{ steps.check.outputs.contfu-npm-changed }}
      client-npm-changed: ${{ steps.check.outputs.client-npm-changed }}
      server-npm-changed: ${{ steps.check.outputs.server-npm-changed }}
      bun-file-store-npm-changed: ${{ steps.check.outputs.bun-file-store-npm-changed }}
      media-optimizer-npm-changed: ${{ steps.check.outputs.media-optimizer-npm-changed }}
      media-optimizer-remote-npm-changed: ${{ steps.check.outputs.media-optimizer-remote-npm-changed }}
      svc-core-npm-changed: ${{ steps.check.outputs.svc-core-npm-changed }}
      svc-api-npm-changed: ${{ steps.check.outputs.svc-api-npm-changed }}
      cli-npm-changed: ${{ steps.check.outputs.cli-npm-changed }}
      ui-npm-changed: ${{ steps.check.outputs.ui-npm-changed }}
      react-npm-changed: ${{ steps.check.outputs.react-npm-changed }}
      vue-npm-changed: ${{ steps.check.outputs.vue-npm-changed }}
      angular-npm-changed: ${{ steps.check.outputs.angular-npm-changed }}
      solid-npm-changed: ${{ steps.check.outputs.solid-npm-changed }}
      svelte-npm-changed: ${{ steps.check.outputs.svelte-npm-changed }}
      sanity-npm-changed: ${{ steps.check.outputs.sanity-npm-changed }}
      strapi-npm-changed: ${{ steps.check.outputs.strapi-npm-changed }}
      webhook-npm-changed: ${{ steps.check.outputs.webhook-npm-changed }}
      server-docker-changed: ${{ steps.check.outputs.server-docker-changed }}
      ui-docker-changed: ${{ steps.check.outputs.ui-docker-changed }}
      server-version: ${{ steps.check.outputs.server-version }}
      ui-version: ${{ steps.check.outputs.ui-version }}
      npm-changed: ${{ steps.check.outputs.npm-changed }}
      docker-changed: ${{ steps.check.outputs.docker-changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if version published
        id: check
        shell: bash
        run: |
          function get_version() {
            local package_path=$1
            if [ -f "$package_path" ]; then
              jq -r .version "$package_path" || echo "0.0.0"
            else
              echo "0.0.0"
            fi
          }

          function get_npm_version() {
            npm view "$1" version 2>/dev/null || echo "0.0.0"
          }

          function get_dockerhub_version() {
            local image=$1 tag=$2
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${image}/tags/${tag}/")
            [ "$status" = "200" ] && echo "$tag" || echo "0.0.0"
          }

          function check_changed() {
            local name=$1 current=$2 published=$3 aggregate=$4
            local changed=$([ "$current" != "$published" ] && echo "true" || echo "false")
            if [ "$changed" = "true" ]; then
              echo "${aggregate}-changed=true" >> "$GITHUB_OUTPUT"
            fi
            echo "${name}-changed=$changed" >> "$GITHUB_OUTPUT"
          }

          CURRENT_CORE_VERSION=$(get_version "packages/core/package.json")
          CURRENT_CONNECT_VERSION=$(get_version "packages/connect/package.json")
          CURRENT_CONTFU_VERSION=$(get_version "packages/contfu/package.json")
          CURRENT_CLIENT_VERSION=$(get_version "packages/client/package.json")
          CURRENT_SERVER_VERSION=$(get_version "packages/server/package.json")
          CURRENT_BUN_FILE_STORE_VERSION=$(get_version "packages/files/bun-file-store/package.json")
          CURRENT_MEDIA_OPTIMIZER_VERSION=$(get_version "packages/files/media-optimizer/package.json")
          CURRENT_MEDIA_OPTIMIZER_REMOTE_VERSION=$(get_version "packages/files/media-optimizer-remote/package.json")
          CURRENT_SVC_CORE_VERSION=$(get_version "packages/service/core/package.json")
          CURRENT_SVC_API_VERSION=$(get_version "packages/service/api/package.json")
          CURRENT_CLI_VERSION=$(get_version "packages/cli/package.json")
          CURRENT_UI_VERSION=$(get_version "packages/ui/package.json")
          CURRENT_REACT_VERSION=$(get_version "packages/react/package.json")
          CURRENT_VUE_VERSION=$(get_version "packages/vue/package.json")
          CURRENT_ANGULAR_VERSION=$(get_version "packages/angular/package.json")
          CURRENT_SOLID_VERSION=$(get_version "packages/solid/package.json")
          CURRENT_SVELTE_VERSION=$(get_version "packages/svelte/package.json")
          CURRENT_SANITY_VERSION=$(get_version "packages/plugins/sanity/package.json")
          CURRENT_STRAPI_VERSION=$(get_version "packages/plugins/strapi/package.json")
          CURRENT_WEBHOOK_VERSION=$(get_version "packages/webhook/package.json")

          PUBLISHED_CORE_NPM=$(get_npm_version "@contfu/core")
          PUBLISHED_CONNECT_NPM=$(get_npm_version "@contfu/connect")
          PUBLISHED_CONTFU_NPM=$(get_npm_version "@contfu/contfu")
          PUBLISHED_CLIENT_NPM=$(get_npm_version "@contfu/client")
          PUBLISHED_SERVER_NPM=$(get_npm_version "@contfu/server")
          PUBLISHED_BUN_FILE_STORE_NPM=$(get_npm_version "@contfu/bun-file-store")
          PUBLISHED_MEDIA_OPTIMIZER_NPM=$(get_npm_version "@contfu/media-optimizer")
          PUBLISHED_MEDIA_OPTIMIZER_REMOTE_NPM=$(get_npm_version "@contfu/media-optimizer-remote")
          PUBLISHED_SVC_CORE_NPM=$(get_npm_version "@contfu/svc-core")
          PUBLISHED_SVC_API_NPM=$(get_npm_version "@contfu/svc-api")
          PUBLISHED_CLI_NPM=$(get_npm_version "@contfu/cli")
          PUBLISHED_UI_NPM=$(get_npm_version "@contfu/ui")
          PUBLISHED_REACT_NPM=$(get_npm_version "@contfu/react")
          PUBLISHED_VUE_NPM=$(get_npm_version "@contfu/vue")
          PUBLISHED_ANGULAR_NPM=$(get_npm_version "@contfu/angular")
          PUBLISHED_SOLID_NPM=$(get_npm_version "@contfu/solid")
          PUBLISHED_SVELTE_NPM=$(get_npm_version "@contfu/svelte")
          PUBLISHED_SANITY_NPM=$(get_npm_version "@contfu/sanity")
          PUBLISHED_STRAPI_NPM=$(get_npm_version "@contfu/strapi")
          PUBLISHED_WEBHOOK_NPM=$(get_npm_version "@contfu/webhook")

          PUBLISHED_SERVER_DOCKER=$(get_dockerhub_version "contfu/server" "$CURRENT_SERVER_VERSION")
          PUBLISHED_UI_DOCKER=$(get_dockerhub_version "contfu/client" "$CURRENT_UI_VERSION")

          check_changed "core-npm"                   "$CURRENT_CORE_VERSION"                   "$PUBLISHED_CORE_NPM"                   "npm"
          check_changed "connect-npm"                "$CURRENT_CONNECT_VERSION"                "$PUBLISHED_CONNECT_NPM"                "npm"
          check_changed "contfu-npm"                 "$CURRENT_CONTFU_VERSION"                 "$PUBLISHED_CONTFU_NPM"                 "npm"
          check_changed "client-npm"                 "$CURRENT_CLIENT_VERSION"                 "$PUBLISHED_CLIENT_NPM"                 "npm"
          check_changed "server-npm"                 "$CURRENT_SERVER_VERSION"                 "$PUBLISHED_SERVER_NPM"                 "npm"
          check_changed "bun-file-store-npm"         "$CURRENT_BUN_FILE_STORE_VERSION"         "$PUBLISHED_BUN_FILE_STORE_NPM"         "npm"
          check_changed "media-optimizer-npm"        "$CURRENT_MEDIA_OPTIMIZER_VERSION"        "$PUBLISHED_MEDIA_OPTIMIZER_NPM"        "npm"
          check_changed "media-optimizer-remote-npm" "$CURRENT_MEDIA_OPTIMIZER_REMOTE_VERSION" "$PUBLISHED_MEDIA_OPTIMIZER_REMOTE_NPM" "npm"
          check_changed "svc-core-npm"               "$CURRENT_SVC_CORE_VERSION"               "$PUBLISHED_SVC_CORE_NPM"               "npm"
          check_changed "svc-api-npm"                "$CURRENT_SVC_API_VERSION"                "$PUBLISHED_SVC_API_NPM"                "npm"
          check_changed "cli-npm"                    "$CURRENT_CLI_VERSION"                    "$PUBLISHED_CLI_NPM"                    "npm"
          check_changed "ui-npm"                     "$CURRENT_UI_VERSION"                     "$PUBLISHED_UI_NPM"                     "npm"
          check_changed "react-npm"                  "$CURRENT_REACT_VERSION"                  "$PUBLISHED_REACT_NPM"                  "npm"
          check_changed "vue-npm"                    "$CURRENT_VUE_VERSION"                    "$PUBLISHED_VUE_NPM"                    "npm"
          check_changed "angular-npm"                "$CURRENT_ANGULAR_VERSION"                "$PUBLISHED_ANGULAR_NPM"                "npm"
          check_changed "solid-npm"                  "$CURRENT_SOLID_VERSION"                  "$PUBLISHED_SOLID_NPM"                  "npm"
          check_changed "svelte-npm"                 "$CURRENT_SVELTE_VERSION"                 "$PUBLISHED_SVELTE_NPM"                 "npm"
          check_changed "sanity-npm"                 "$CURRENT_SANITY_VERSION"                 "$PUBLISHED_SANITY_NPM"                 "npm"
          check_changed "strapi-npm"                 "$CURRENT_STRAPI_VERSION"                 "$PUBLISHED_STRAPI_NPM"                 "npm"
          check_changed "webhook-npm"                "$CURRENT_WEBHOOK_VERSION"                "$PUBLISHED_WEBHOOK_NPM"                "npm"
          check_changed "server-docker"              "$CURRENT_SERVER_VERSION"                 "$PUBLISHED_SERVER_DOCKER"              "docker"
          check_changed "ui-docker"                  "$CURRENT_UI_VERSION"                     "$PUBLISHED_UI_DOCKER"                  "docker"

          echo "server-version=$CURRENT_SERVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "ui-version=$CURRENT_UI_VERSION" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: check-version
    if: needs.check-version.outputs.npm-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: ./scripts/retry-timeout.sh --timeout 60 --retries 3 -- bun install --frozen-lockfile
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun run build
      - name: Publish changed npm packages
        env:
          CORE_CHANGED: ${{ needs.check-version.outputs.core-npm-changed }}
          CONNECT_CHANGED: ${{ needs.check-version.outputs.connect-npm-changed }}
          CONTFU_CHANGED: ${{ needs.check-version.outputs.contfu-npm-changed }}
          CLIENT_CHANGED: ${{ needs.check-version.outputs.client-npm-changed }}
          SERVER_CHANGED: ${{ needs.check-version.outputs.server-npm-changed }}
          BUN_FILE_STORE_CHANGED: ${{ needs.check-version.outputs.bun-file-store-npm-changed }}
          MEDIA_OPTIMIZER_CHANGED: ${{ needs.check-version.outputs.media-optimizer-npm-changed }}
          MEDIA_OPTIMIZER_REMOTE_CHANGED: ${{ needs.check-version.outputs.media-optimizer-remote-npm-changed }}
          SVC_CORE_CHANGED: ${{ needs.check-version.outputs.svc-core-npm-changed }}
          SVC_API_CHANGED: ${{ needs.check-version.outputs.svc-api-npm-changed }}
          CLI_CHANGED: ${{ needs.check-version.outputs.cli-npm-changed }}
          UI_CHANGED: ${{ needs.check-version.outputs.ui-npm-changed }}
          REACT_CHANGED: ${{ needs.check-version.outputs.react-npm-changed }}
          VUE_CHANGED: ${{ needs.check-version.outputs.vue-npm-changed }}
          ANGULAR_CHANGED: ${{ needs.check-version.outputs.angular-npm-changed }}
          SOLID_CHANGED: ${{ needs.check-version.outputs.solid-npm-changed }}
          SVELTE_CHANGED: ${{ needs.check-version.outputs.svelte-npm-changed }}
          SANITY_CHANGED: ${{ needs.check-version.outputs.sanity-npm-changed }}
          WEBHOOK_CHANGED: ${{ needs.check-version.outputs.webhook-npm-changed }}
          STRAPI_CHANGED: ${{ needs.check-version.outputs.strapi-npm-changed }}
        shell: bash
        run: |
          publish_package() {
            local name=$1
            local directory=$2
            local changed=$3
            local version
            local error_file

            [ "$changed" = "true" ] || return 0
            version=$(jq -r .version "$directory/package.json")
            error_file=$(mktemp)

            if npm view "$name@$version" version > /dev/null 2>"$error_file"; then
              echo "$name@$version is already published; skipping."
              rm -f "$error_file"
              return 0
            fi

            if ! grep -qE 'E404|404' "$error_file"; then
              cat "$error_file" >&2
              rm -f "$error_file"
              return 1
            fi
            rm -f "$error_file"

            echo "Publishing $name@$version."
            if (cd "$directory" && bun run pack && npm publish *.tgz --access public --provenance); then
              return 0
            fi

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version was published concurrently; treating it as successful."
              return 0
            fi
            return 1
          }

          publish_package '@contfu/core' './packages/core' "$CORE_CHANGED"
          publish_package '@contfu/connect' './packages/connect' "$CONNECT_CHANGED"
          publish_package '@contfu/contfu' './packages/contfu' "$CONTFU_CHANGED"
          publish_package '@contfu/client' './packages/client' "$CLIENT_CHANGED"
          publish_package '@contfu/server' './packages/server' "$SERVER_CHANGED"
          publish_package '@contfu/bun-file-store' './packages/files/bun-file-store' "$BUN_FILE_STORE_CHANGED"
          publish_package '@contfu/media-optimizer' './packages/files/media-optimizer' "$MEDIA_OPTIMIZER_CHANGED"
          publish_package '@contfu/media-optimizer-remote' './packages/files/media-optimizer-remote' "$MEDIA_OPTIMIZER_REMOTE_CHANGED"
          publish_package '@contfu/svc-core' './packages/service/core' "$SVC_CORE_CHANGED"
          publish_package '@contfu/svc-api' './packages/service/api' "$SVC_API_CHANGED"
          publish_package '@contfu/cli' './packages/cli' "$CLI_CHANGED"
          publish_package '@contfu/ui' './packages/ui' "$UI_CHANGED"
          publish_package '@contfu/react' './packages/react' "$REACT_CHANGED"
          publish_package '@contfu/vue' './packages/vue' "$VUE_CHANGED"
          publish_package '@contfu/angular' './packages/angular' "$ANGULAR_CHANGED"
          publish_package '@contfu/solid' './packages/solid' "$SOLID_CHANGED"
          publish_package '@contfu/svelte' './packages/svelte' "$SVELTE_CHANGED"
          publish_package '@contfu/sanity' './packages/plugins/sanity' "$SANITY_CHANGED"
          publish_package '@contfu/webhook' './packages/webhook' "$WEBHOOK_CHANGED"
          publish_package '@contfu/strapi' './packages/plugins/strapi' "$STRAPI_CHANGED"

  publish-docker:
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.docker-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push server image
        if: needs.check-version.outputs.server-docker-changed == 'true'
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: contfu/server:latest,contfu/server:${{ needs.check-version.outputs.server-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push UI image
        if: needs.check-version.outputs.ui-docker-changed == 'true'
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: contfu/client:latest,contfu/client:${{ needs.check-version.outputs.ui-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
