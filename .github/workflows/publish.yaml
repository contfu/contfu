name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    name: Check if version published
    runs-on: ubuntu-latest
    outputs:
      server-docker-changed: ${{ steps.check.outputs.server-docker-changed }}
      ui-docker-changed: ${{ steps.check.outputs.ui-docker-changed }}
      server-version: ${{ steps.check.outputs.server-version }}
      ui-version: ${{ steps.check.outputs.ui-version }}
      npm-changed: ${{ steps.check.outputs.npm-changed }}
      docker-changed: ${{ steps.check.outputs.docker-changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if version published
        id: check
        shell: bash
        run: |
          function get_version() {
            local package_path=$1
            if [ -f "$package_path" ]; then
              jq -r .version "$package_path" || echo "0.0.0"
            else
              echo "0.0.0"
            fi
          }

          function get_npm_version() {
            npm view "$1" version 2>/dev/null || echo "0.0.0"
          }

          function get_dockerhub_version() {
            local image=$1 tag=$2
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${image}/tags/${tag}/")
            [ "$status" = "200" ] && echo "$tag" || echo "0.0.0"
          }

          CURRENT_SERVER_VERSION=$(get_version "packages/server/package.json")
          CURRENT_UI_VERSION=$(get_version "packages/ui/package.json")

          npm_changed=false
          while IFS='|' read -r package_path package_name; do
            current_version=$(get_version "$package_path")
            published_version=$(get_npm_version "$package_name")
            if [ "$current_version" != "$published_version" ]; then
              npm_changed=true
              break
            fi
          done <<'EOF'
          packages/core/package.json|@contfu/core
          packages/connect/package.json|@contfu/connect
          packages/contfu/package.json|@contfu/contfu
          packages/client/package.json|@contfu/client
          packages/server/package.json|@contfu/server
          packages/files/bun-file-store/package.json|@contfu/bun-file-store
          packages/files/media-optimizer/package.json|@contfu/media-optimizer
          packages/files/media-optimizer-remote/package.json|@contfu/media-optimizer-remote
          packages/service/core/package.json|@contfu/svc-core
          packages/service/api/package.json|@contfu/svc-api
          packages/cli/package.json|@contfu/cli
          packages/ui/package.json|@contfu/ui
          packages/react/package.json|@contfu/react
          packages/vue/package.json|@contfu/vue
          packages/angular/package.json|@contfu/angular
          packages/solid/package.json|@contfu/solid
          packages/svelte/package.json|@contfu/svelte
          packages/plugins/sanity/package.json|@contfu/sanity
          packages/plugins/strapi/package.json|@contfu/strapi
          packages/webhook/package.json|@contfu/webhook
          EOF

          if [ "$npm_changed" = "true" ]; then
            echo "npm-changed=true" >> "$GITHUB_OUTPUT"
          fi

          PUBLISHED_SERVER_DOCKER=$(get_dockerhub_version "contfu/server" "$CURRENT_SERVER_VERSION")
          PUBLISHED_UI_DOCKER=$(get_dockerhub_version "contfu/client" "$CURRENT_UI_VERSION")

          check_changed() {
            local name=$1 current=$2 published=$3 aggregate=$4
            local changed=$([ "$current" != "$published" ] && echo "true" || echo "false")
            if [ "$changed" = "true" ]; then
              echo "${aggregate}-changed=true" >> "$GITHUB_OUTPUT"
            fi
            echo "${name}-changed=$changed" >> "$GITHUB_OUTPUT"
          }

          check_changed "server-docker" "$CURRENT_SERVER_VERSION" "$PUBLISHED_SERVER_DOCKER" "docker"
          check_changed "ui-docker" "$CURRENT_UI_VERSION" "$PUBLISHED_UI_DOCKER" "docker"

          echo "server-version=$CURRENT_SERVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "ui-version=$CURRENT_UI_VERSION" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: check-version
    if: needs.check-version.outputs.npm-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: ./scripts/retry-timeout.sh --timeout 60 --retries 3 -- bun install --frozen-lockfile
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun run build
      - name: Publish changed npm packages
        shell: bash
        run: |
          publish_package() {
            local name=$1
            local directory=$2
            local version
            local error_file

            version=$(jq -r .version "$directory/package.json")
            error_file=$(mktemp)

            if npm view "$name@$version" version > /dev/null 2>"$error_file"; then
              echo "$name@$version is already published; skipping."
              rm -f "$error_file"
              return 0
            fi

            if ! grep -qE 'E404|404' "$error_file"; then
              cat "$error_file" >&2
              rm -f "$error_file"
              return 1
            fi
            rm -f "$error_file"

            echo "Publishing $name@$version."
            if (cd "$directory" && bun run pack && npm publish *.tgz --access public --provenance); then
              return 0
            fi

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version was published concurrently; treating it as successful."
              return 0
            fi
            return 1
          }

          publish_package '@contfu/core' './packages/core'
          publish_package '@contfu/connect' './packages/connect'
          publish_package '@contfu/contfu' './packages/contfu'
          publish_package '@contfu/client' './packages/client'
          publish_package '@contfu/server' './packages/server'
          publish_package '@contfu/bun-file-store' './packages/files/bun-file-store'
          publish_package '@contfu/media-optimizer' './packages/files/media-optimizer'
          publish_package '@contfu/media-optimizer-remote' './packages/files/media-optimizer-remote'
          publish_package '@contfu/svc-core' './packages/service/core'
          publish_package '@contfu/svc-api' './packages/service/api'
          publish_package '@contfu/cli' './packages/cli'
          publish_package '@contfu/ui' './packages/ui'
          publish_package '@contfu/react' './packages/react'
          publish_package '@contfu/vue' './packages/vue'
          publish_package '@contfu/angular' './packages/angular'
          publish_package '@contfu/solid' './packages/solid'
          publish_package '@contfu/svelte' './packages/svelte'
          publish_package '@contfu/sanity' './packages/plugins/sanity'
          publish_package '@contfu/webhook' './packages/webhook'
          publish_package '@contfu/strapi' './packages/plugins/strapi'

  publish-docker:
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.docker-changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push server image
        if: needs.check-version.outputs.server-docker-changed == 'true'
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: contfu/server:latest,contfu/server:${{ needs.check-version.outputs.server-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push UI image
        if: needs.check-version.outputs.ui-docker-changed == 'true'
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: contfu/client:latest,contfu/client:${{ needs.check-version.outputs.ui-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
