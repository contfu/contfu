[install]
# Use isolated linking - each workspace gets its own node_modules
# This prevents native module issues with hoisting
link = "isolated"
# Only install package versions published at least 3 days ago
minimumReleaseAge = 259200

[test]
# Package-specific preloads should be in package bunfig.toml files
# Do not preload globally as it causes drizzle-orm module conflicts
